<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Calculator</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
        }
        .calc-card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 2.5rem; 
            border-radius: 25px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            width: 320px; 
            text-align: center;
            backdrop-filter: blur(10px);
        }
        h2 { color: #333; margin-bottom: 20px; }
        input, select { 
            width: 100%; padding: 14px; margin: 10px 0; 
            border: 2px solid #eee; border-radius: 12px; 
            font-size: 16px; box-sizing: border-box;
        }
        button { 
            width: 100%; padding: 15px; margin-top: 10px;
            background: #764ba2; color: white; border: none; 
            border-radius: 12px; font-size: 18px; font-weight: bold; 
            cursor: pointer; transition: 0.3s; 
        }
        button:hover { background: #5a377d; transform: translateY(-2px); }
        #res { 
            font-size: 1.8rem; font-weight: bold; color: #764ba2; 
            margin-top: 25px; padding: 10px; border-top: 2px solid #eee;
        }
    </style>
</head>
<body>
    <div class="calc-card">
        <h2>Calculator</h2>
        <input type="number" id="num1" placeholder="Number 1">
        <input type="number" id="num2" placeholder="Number 2">
        <select id="op">
            <option value="+">Addition (+)</option>
            <option value="-">Subtraction (-)</option>
            <option value="*">Multiplication (*)</option>
            <option value="/">Division (/)</option>
        </select>
        <button id="calcBtn" onclick="calculate()">Calculate</button>
        <div id="res">Result: -</div>
    </div>

    <script>
        async function calculate() {
            const btn = document.getElementById('calcBtn');
            const resDiv = document.getElementById('res');
            
            btn.innerText = "Calculating...";
            btn.disabled = true;

            const data = {
                num1: document.getElementById('num1').value,
                num2: document.getElementById('num2').value,
                operation: document.getElementById('op').value
            };

            try {
                const response = await fetch('/calculate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const res = await response.json();
                resDiv.innerText = "Result: " + (res.result ?? res.error);
            } catch (err) {
                resDiv.innerText = "Error!";
            } finally {
                btn.innerText = "Calculate";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
