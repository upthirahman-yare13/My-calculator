<!DOCTYPE html>
<html>
<head>
    <title>Professional Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .calc { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 320px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #res { font-size: 1.2em; color: #333; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="calc">
        <h2 style="text-align: center;">Calculator</h2>
        <input type="number" id="num1" placeholder="Number 1">
        <input type="number" id="num2" placeholder="Number 2">
        <select id="op">
            <option value="+">Addition (+)</option>
            <option value="-">Subtraction (-)</option>
            <option value="*">Multiplication (*)</option>
            <option value="/">Division (/)</option>
        </select>
        <button onclick="calc()">Calculate</button>
        <h3 id="res">Result: </h3>
    </div>

    <script>
        function calc() {
            let n1 = document.getElementById('num1').value;
            let n2 = document.getElementById('num2').value;
            let op = document.getElementById('op').value;
            
            fetch('/calculate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({num1: n1, num2: n2, operation: op})
            })
            .then(res => res.json())
            .then(data => {
                if(data.result !== undefined) {
                    document.getElementById('res').innerText = "Result: " + data.result;
                } else {
                    document.getElementById('res').innerText = "Error: " + data.error;
                }
            });
        }
    </script>
</body>
</html>
